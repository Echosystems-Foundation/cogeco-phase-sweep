[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogeco-phase-sweep"
version = "0.1.0"
description = "Does a constraint-governance simulation show regime boundaries in its parameter space? A reproducible phase sweep."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EchoSystems Foundation" }]
license = { text = "Apache-2.0" }
keywords = ["simulation", "phase-diagram", "reproducibility", "governance", "regimes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]

# The sweep itself is standard library only. numpy is needed by the metric
# bridge; matplotlib only for plots. Both ordinary, both public.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
cogeco-sweep = "cogeco.cli:main"

[tool.setuptools.packages.find]
include = ["cogeco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
